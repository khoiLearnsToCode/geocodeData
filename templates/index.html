<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalat Routes Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 350px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 1000;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        select:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .info-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
        }
        
        .info-box.show {
            display: block;
        }
        
        .info-box h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .info-box p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        
        .error {
            color: #f44336;
            font-size: 14px;
            margin-top: 10px;
        }
        
        #map {
            flex: 1;
            height: 100%;
        }
        
        .loading {
            display: none;
            margin-top: 10px;
            text-align: center;
            color: #666;
        }
        
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🗺️ Dalat Routes</h1>
            
            <div class="form-group">
                <label for="origin">Origin:</label>
                <select id="origin">
                    <option value="">Select starting point...</option>
                    {% for place in places %}
                    <option value="{{ place.id }}">{{ place.id }} - {{ place.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="dest">Destination:</label>
                <select id="dest">
                    <option value="">Select destination...</option>
                    {% for place in places %}
                    <option value="{{ place.id }}">{{ place.id }} - {{ place.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <button id="showRoute" onclick="showRoute()">Show Route</button>
            
            <div class="loading" id="loading">Loading route...</div>
            <div class="error" id="error"></div>
            
            <div class="info-box" id="routeInfo">
                <h3>Route Information</h3>
                <p id="routeDetails"></p>
            </div>
        </div>
        
        <div id="map"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Dalat
        const map = L.map('map').setView([11.9404, 108.4583], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        let routeLayer = null;
        let originMarker = null;
        let destMarker = null;
        
        const places = {{ places | tojson }};
        
        async function showRoute() {
            const originId = document.getElementById('origin').value;
            const destId = document.getElementById('dest').value;
            const errorDiv = document.getElementById('error');
            const loading = document.getElementById('loading');
            const infoBox = document.getElementById('routeInfo');
            
            errorDiv.textContent = '';
            infoBox.classList.remove('show');
            
            if (!originId || !destId) {
                errorDiv.textContent = 'Please select both origin and destination';
                return;
            }
            
            if (originId === destId) {
                errorDiv.textContent = 'Origin and destination must be different';
                return;
            }
            
            loading.classList.add('show');
            document.getElementById('showRoute').disabled = true;
            
            try {
                const response = await fetch('/get_route', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origin: originId,
                        dest: destId
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.route) {
                    // Clear previous markers (but not route since we don't draw it)
                    if (originMarker) map.removeLayer(originMarker);
                    if (destMarker) map.removeLayer(destMarker);
                    
                    // Get place info
                    const originPlace = places.find(p => p.id === originId);
                    const destPlace = places.find(p => p.id === destId);
                    
                    // Add markers only (no polyline drawing)
                    originMarker = L.marker([originPlace.lat, originPlace.lon], {
                        icon: L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        })
                    }).addTo(map).bindPopup(`<b>Origin:</b><br>${originPlace.name}`);
                    
                    destMarker = L.marker([destPlace.lat, destPlace.lon], {
                        icon: L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        })
                    }).addTo(map).bindPopup(`<b>Destination:</b><br>${destPlace.name}`);
                    
                    // Fit map to show both markers
                    const bounds = L.latLngBounds([originPlace.lat, originPlace.lon], [destPlace.lat, destPlace.lon]);
                    map.fitBounds(bounds, { padding: [50, 50] });
                    
                    // Show route info
                    document.getElementById('routeDetails').innerHTML = `
                        <strong>From:</strong> ${originPlace.name}<br>
                        <strong>To:</strong> ${destPlace.name}<br>
                        <strong>Route points:</strong> ${data.route.length}
                    `;
                    infoBox.classList.add('show');
                } else {
                    errorDiv.textContent = data.error || 'Route not found';
                }
            } catch (error) {
                errorDiv.textContent = 'Error loading route: ' + error.message;
            } finally {
                loading.classList.remove('show');
                document.getElementById('showRoute').disabled = false;
            }
        }
        
        // Allow Enter key to trigger route search
        document.getElementById('dest').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                showRoute();
            }
        });
    </script>
</body>
</html>
